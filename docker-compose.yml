services:

  # -----------------------------
  # PostgreSQL Database
  # -----------------------------
  postgres:
    image: postgres:15
    container_name: pricing_postgres
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pricing_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -----------------------------
  # FastAPI Backend
  # -----------------------------
  app:
    build: .
    container_name: pricing_backend
    restart: always
    command: >
      sh -c "
      alembic upgrade head &&
      python scripts/seed_db.py &&
      uvicorn main:app --host 0.0.0.0 --port 8000
      "
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SYNC_DATABASE_URL: ${SYNC_DATABASE_URL}
      REPORT_EMAIL: ${REPORT_EMAIL}
      REPORT_EMAIL_PASSWORD: ${REPORT_EMAIL_PASSWORD}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  # -----------------------------
  # NGINX API Gateway
  # -----------------------------
  nginx:
    image: nginx:latest
    container_name: pricing_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      app:
        condition: service_healthy

  # -----------------------------
  # Prometheus
  # -----------------------------
  prometheus:
    image: prom/prometheus
    container_name: pricing_prometheus
    restart: always
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    depends_on:
      app:
        condition: service_healthy

  # -----------------------------
  # Grafana
  # -----------------------------
  grafana:
    image: grafana/grafana
    container_name: pricing_grafana
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SMTP_ENABLED=true
      - GF_SMTP_HOST=smtp.gmail.com:587
      - GF_SMTP_USER=${REPORT_EMAIL}
      - GF_SMTP_PASSWORD=${REPORT_EMAIL_PASSWORD}
      - GF_SMTP_FROM_ADDRESS=${REPORT_EMAIL}
      - GF_SMTP_FROM_NAME=Pricing AI Alerts
      - GF_SMTP_STARTTLS_POLICY=MandatoryStartTLS
    depends_on:
      - prometheus

# -----------------------------
# Volumes
# -----------------------------
volumes:
  pgdata:
  grafana_data: