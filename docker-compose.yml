services:
  # -----------------------------
  # PostgreSQL Database
  # -----------------------------
  postgres:
    image: postgres:15
    container_name: pricing_postgres
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -----------------------------
  # Keycloak Auth Server
  # -----------------------------
  keycloak:
    image: quay.io/keycloak/keycloak:23.0
    container_name: pricing_keycloak
    restart: always
    command: ["start-dev", "--http-enabled=true", "--hostname-strict=false", "--hostname-strict-https=false"]
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_HTTP_ENABLED: "true"
      KC_HTTP_PORT: 8080
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: 8080
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_PROXY: edge
      KC_LOG_LEVEL: info
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  # -----------------------------
  # FastAPI Backend
  # -----------------------------
  app:
    build: .
    container_name: pricing_backend
    restart: always
    command: >
      sh -c "
      alembic upgrade head &&
      python scripts/seed_db.py &&
      uvicorn main:app --host 0.0.0.0 --port 8000
      "
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SYNC_DATABASE_URL: ${SYNC_DATABASE_URL}
      REPORT_EMAIL: ${REPORT_EMAIL}
      REPORT_EMAIL_PASSWORD: ${REPORT_EMAIL_PASSWORD}
      KEYCLOAK_URL: ${KEYCLOAK_URL}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  # -----------------------------
  # Docker Test Runner (NEW)
  # -----------------------------
  test:
    build: .
    container_name: pricing_tests
    command: pytest tests/ -v
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://pricing_user:pricing_pass@postgres:5432/pricing_test_db
      SYNC_DATABASE_URL: postgresql://pricing_user:pricing_pass@postgres:5432/pricing_test_db
      PYTHONPATH: /app
    volumes:
      - .:/app

  # -----------------------------
  # NGINX API Gateway
  # -----------------------------
  nginx:
    image: nginx:latest
    container_name: pricing_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      app:
        condition: service_healthy

  # -----------------------------
  # Prometheus
  # -----------------------------
  prometheus:
    image: prom/prometheus
    container_name: pricing_prometheus
    restart: always
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    depends_on:
      app:
        condition: service_healthy

  # -----------------------------
  # Grafana
  # -----------------------------
  grafana:
    image: grafana/grafana
    container_name: pricing_grafana
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - grafana_data:/var/lib/grafana
    environment:
      GF_SMTP_ENABLED: "true"
      GF_SMTP_HOST: smtp.gmail.com:587
      GF_SMTP_USER: ${REPORT_EMAIL}
      GF_SMTP_PASSWORD: ${REPORT_EMAIL_PASSWORD}
      GF_SMTP_FROM_ADDRESS: ${REPORT_EMAIL}
      GF_SMTP_FROM_NAME: Pricing AI Alerts
      GF_SMTP_STARTTLS_POLICY: MandatoryStartTLS
    depends_on:
      - prometheus

# -----------------------------
# Volumes
# -----------------------------
volumes:
  pgdata:
  grafana_data: